apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edp-default-deny-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: edp
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edp-allow-ingress-controller
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [edp-api, edp-console, edp-platform-admin, edp-widget]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edp-allow-openim-callbacks
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edp-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openim
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edp-allow-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: edp
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9464
