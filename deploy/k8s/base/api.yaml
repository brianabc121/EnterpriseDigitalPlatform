# API：可以水平扩展（HPA 按 CPU）。/hooks/openim 只在集群内可达（Ingress 不转发）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edp-api
  labels:
    app.kubernetes.io/name: edp-api
    app.kubernetes.io/component: api
spec:
  # 副本数由 HPA 管理（不在这里写死，重新部署时不会被覆盖）。
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: edp-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edp-api
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: edp-api
      containers:
        - name: api
          image: edp-backend
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: edp-config
            - secretRef:
                name: edp-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                # 摘掉流量后再退出。
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: edp-api
  labels:
    app.kubernetes.io/name: edp-api
spec:
  selector:
    app.kubernetes.io/name: edp-api
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edp-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edp-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edp-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edp-api
