# 调度进程：持有租约的实例执行周期任务并导出状态类指标，另一个实例待命。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edp-scheduler
  labels:
    app.kubernetes.io/name: edp-scheduler
    app.kubernetes.io/component: scheduler
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: edp-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edp-scheduler
        app.kubernetes.io/component: scheduler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      containers:
        - name: scheduler
          image: edp-backend
          command: ["python", "-m", "app.scheduler"]
          ports:
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: edp-config
            - secretRef:
                name: edp-secrets
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: edp-scheduler
  labels:
    app.kubernetes.io/name: edp-scheduler
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: edp-scheduler
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edp-scheduler
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edp-scheduler
