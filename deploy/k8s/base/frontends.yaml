# 三个前端应用：nginx 提供静态文件（8080 端口），API 请求由 Ingress 按路径转发给 edp-api。
# 控制台（员工工作台与租户管理）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edp-console
  labels:
    app.kubernetes.io/name: edp-console
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: edp-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edp-console
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: edp-console
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: EDP_WIDGET_URL
              valueFrom:
                configMapKeyRef:
                  name: edp-config
                  key: EDP_WIDGET_PUBLIC_URL
            - name: EDP_TRANSPORT_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: edp-config
                  key: EDP_TRANSPORT_PUBLIC_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: edp-console
  labels:
    app.kubernetes.io/name: edp-console
spec:
  selector:
    app.kubernetes.io/name: edp-console
  ports:
    - name: http
      port: 80
      targetPort: http
---
