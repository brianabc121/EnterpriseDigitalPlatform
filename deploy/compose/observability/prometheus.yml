# 本地开发：抓取宿主机上运行的平台进程（生产环境由 deploy/k8s 的 ServiceMonitor 发现）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: edp-api
    static_configs:
      - targets: ["host.docker.internal:9464"]
  - job_name: edp-worker
    static_configs:
      - targets: ["host.docker.internal:9465"]
  - job_name: edp-scheduler
    static_configs:
      - targets: ["host.docker.internal:9466"]
