# 告警规则的单元测试：
#   docker run --rm -v "$PWD/deploy/observability/prometheus:/rules" \
#     --entrypoint promtool prom/prometheus test rules /rules/alerts.test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # 排队最久的会话超过 5 分钟，持续 2 分钟后告警。
  - interval: 1m
    input_series:
      - series: 'edp_queue_oldest_wait_seconds{tenant="t1", job="edp-scheduler", instance="s1"}'
        values: "200 260 320 380 440 500"
      - series: 'edp_queue_oldest_wait_seconds{tenant="t2", job="edp-scheduler", instance="s1"}'
        values: "10 10 10 10 10 10"
    alert_rule_test:
      - eval_time: 3m
        alertname: EdpQueueWaitTooLong
        exp_alerts: []
      - eval_time: 5m
        alertname: EdpQueueWaitTooLong
        exp_alerts:
          - exp_labels:
              severity: warning
              tenant: t1
            exp_annotations:
              summary: "租户 t1 有会话排队超过 5 分钟"
              description: "排队最久的会话已等待 8m 20s，检查坐席在线与接待上限。"

  # 大模型失败率超过 20% 且调用量够多时告警；调用量太少时不告警。
  - interval: 1m
    input_series:
      - series: 'edp_llm_calls_total{tenant="t1", scene="reply", provider="p", model="m", status="ok", job="edp-worker", instance="w1"}'
        values: "0+6x20"
      - series: 'edp_llm_calls_total{tenant="t1", scene="reply", provider="p", model="m", status="error", job="edp-worker", instance="w1"}'
        values: "0+4x20"
      - series: 'edp_llm_calls_total{tenant="t2", scene="reply", provider="p", model="m", status="error", job="edp-worker", instance="w1"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: EdpLlmErrorRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              tenant: t1
            exp_annotations:
              summary: "租户 t1 大模型调用失败率 40%"
              description: "失败时 AI 接待会转人工；检查供应商状态、额度与并发上限（status=busy 表示排队超时）。"

  # 有事件进入死信就告警（按事件类型）。
  - interval: 1m
    input_series:
      - series: 'edp_dead_letters_total{type="message.received", tenant="t1", job="edp-worker", instance="w1"}'
        values: "0 0 1 1 1"
    alert_rule_test:
      - eval_time: 4m
        alertname: EdpDeadLetters
        exp_alerts:
          - exp_labels:
              severity: warning
              type: message.received
            exp_annotations:
              summary: "message.received 事件处理失败进入死信（15 分钟内 1 条）"
              description: "在运营后台「运维 → 死信与发件箱」查看错误并重新处理。"

  # 企业微信授权取消。
  - interval: 1m
    input_series:
      - series: 'edp_wecom_auth_invalid{tenant="t1", job="edp-scheduler", instance="s1"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: EdpWecomAuthCancelled
        exp_alerts:
          - exp_labels:
              severity: warning
              tenant: t1
            exp_annotations:
              summary: "租户 t1 的企业微信授权已取消"
              description: "微信客服与客户联系不可用，需要企业管理员重新授权。"

  # 调度进程不在了：没有任何任务的成功时间。
  - interval: 1m
    input_series:
      - series: 'edp_job_last_success_timestamp_seconds{task="reconcile", job="edp-scheduler", instance="s1"}'
        values: "60x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: EdpSchedulerMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              task: im-ops
            exp_annotations:
              summary: "没有调度进程在执行任务"
              description: "对账、会话超时、发件箱重试等周期任务都已停止。"
