[project]
name = "edp-backend"
version = "0.1.0"
description = "Enterprise Digital Platform backend (multi-tenant omnichannel customer service)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "uuid-utils>=0.9",
    "redis>=6",
    "httpx>=0.28",
    "cryptography>=43",
    "pypdf>=6.19.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "pypinyin>=0.53",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 中文全角标点在注释和文案中是正常的

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["uuid_utils.*", "asyncpg.*"]
ignore_missing_imports = true
