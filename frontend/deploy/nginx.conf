# 前端静态文件（控制台、运营后台、访客 Widget 共用）：单页应用回退到 index.html；
# 带哈希的资源长期缓存，index.html 和 config.js 不缓存。API 由 Ingress 按路径转发，不经过这里。

# 临时文件都放在 /tmp：以非 root 用户运行，根文件系统可以只读。
client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    include /etc/nginx/edp-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/edp-headers.conf;
        try_files $uri =404;
    }

    # 运行时配置：容器启动时写到 /tmp（根文件系统可以只读）。
    location = /config.js {
        alias /tmp/edp/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
        include /etc/nginx/edp-headers.conf;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/edp-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
