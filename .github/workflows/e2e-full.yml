name: E2E (full)

# 全部浏览器验收（需要 OpenIM、模拟大模型和模拟企业微信）：每天夜里、手动触发，或者提交说明里带
# [e2e-full] 的推送。
on:
  schedule:
    - cron: "30 18 * * *" # 北京时间 02:30
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  e2e:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[e2e-full]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PLATFORM_PASSWORD: ci-ops-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Dev services (PostgreSQL, Redis, SeaweedFS)
        run: docker compose -f deploy/compose/docker-compose.yml up -d --wait
      - name: OpenIM
        run: docker compose -f deploy/compose/openim/docker-compose.yml up -d --wait
      - name: Database and platform account
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run python -m app.cli create-platform-admin --username ops --password "$PLATFORM_PASSWORD"
          uv run python -m app.cli storage-init
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Playwright and ffmpeg
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bash scripts/ci/start-stack.sh
      - name: Browser acceptance
        run: >-
          bash scripts/ci/run-e2e.sh
          p0-acceptance m1-im-acceptance m3-widget-acceptance m4-workbench-acceptance
          m5-transfer-acceptance m6-admin-acceptance p3-ai-acceptance p4-knowledge-acceptance
          p2-wecom-acceptance g1-wecom-extras g2-commerce-ops g3-compliance g4-routing-collab
          g5-ai-knowledge g6-ops-observability p6-todos-acceptance p6-orders-acceptance
          p6-integration-acceptance p7-production-acceptance p8-inventory-acceptance
          p9-warehouse-acceptance p10-entry-history-acceptance p11-transport-consoles-acceptance
          p12-suggest-acceptance p13-assisted-requisition-acceptance p14-form-knowledge-acceptance
          p15-email-acceptance p17-receivables-acceptance p18-print-acceptance p19-profit-acceptance
          p20-staff-access-acceptance p21-intent-acceptance p22-wake-acceptance p23-contract-acceptance
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full
          path: |
            e2e-shots
            e2e-logs
          retention-days: 14
